services:
  # Backend API Service
  - type: web
    name: explainable-dbms-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-backend.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_TYPE
        value: sqlite

  # Frontend Static Site
  - type: web
    name: explainable-dbms-frontend
    env: static
    buildCommand: cd src/explainable_dbms/xai_dbms_frontend && npm install && npm run build
    staticPublishPath: src/explainable_dbms/xai_dbms_frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
